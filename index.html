<!DOCTYPE html>         
<html lang="en">        
    <head>            
        <meta charset="UTF-8">     
        <meta name="viewport" content="width=device-width, initial-scale=1.0">    
        <title>Document</title>   
    </head>       
    <body>         
        <div class="todo-app">
            <div class="title">周慧良的Todo App</div>    
            <div class="todo-form">
                <input class="todo-input" type="text" placeholder="add a todo"/>
                <div class="todo-button">Add todo</div>
            </div>
            <div class="item completed">
                <div>
                    <input type="checkbox"/>
                    <span class="name">吃饭</span>
                </div>
                
                <div class="del">del</div>
            </div>

            <div class="item">
                <div>
                    <input type="checkbox"/>
                    <span class="name">睡觉</span>
                </div>
                
                <div class="del">del</div>
            </div>

            <div class="item">
                <div>
                    <input type="checkbox"/>
                    <span class="name">打豆豆</span>
                </div>
                
                <div class="del">del</div>
            </div>
        </div>

        <script>
            // 1. 抓元素
            const input = document.querySelector('.todo-input');
            const addBtn = document.querySelector('.todo-button');
            const app = document.querySelector('.todo-app');

            // 2. 点击 Add todo
            addBtn.addEventListener('click', function () {
                const text = input.value.trim();

                if (text === '') {
                    alert('请输入内容');
                    return;
                }

                // 3. 造一个新的 item
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div>
                        <input type="checkbox"/>
                        <span class="name">${text}</span>
                    </div>
                    <div class="del">del</div>
                `;

                app.appendChild(item);
                input.value = '';
            });

            // 4. 事件委托：点 del 就删掉整条
            app.addEventListener('click', function (e) {
                if (e.target.classList.contains('del')) {
                    e.target.closest('.item').remove();
                }
            });

            // 5. 勾选框：勾上划线，取消勾恢复
            app.addEventListener('change', function (e) {
                if (e.target.type === 'checkbox') {
                    const item = e.target.closest('.item');
                    item.classList.toggle('completed', e.target.checked);
                }
            });
        </script>

        <style>
            .completed{
                text-decoration: line-through;
                opacity: 0.4;
            }
            .del {
                color: red;
                cursor: pointer;

            }
            .item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                box-sizing: border-box;
                width: 80%;
                height: 50px;
                margin: 8px auto;
                padding: 16px;
                border-radius: 20px;
                box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 20px;

            }
            .todo-button {
                width: 100px;
                height: 50px;
                line-height: 52px;
                border-radius: 0 20px 20px 0;
                text-align: center;
                background: linear-gradient(
                    to right,
                    rgb(113, 65, 168),
                    rgba(44, 114, 251, 1)
                );
                color: #ffff;
                user-select: none;
                cursor: pointer;
            }
            .todo-input {
                box-sizing: border-box;
                margin-bottom: 20px;
                padding-left: 15px;
                border: 1px solid #dfe1e5;
                outline: none;
                width: 60%;
                height: 50px;
                border-radius: 20px 0 0 20px;
            }
            .todo-form {
                display: flex;     
                margin-top: 20px;
                margin-left: 30px;
            }
            body {
                background: linear-gradient(to right, rgb(113, 65, 168), rgba(44, 114, 251, 1));
            }
            .todo-app {
                width: 98%;
                height: 500px;
                background-color: #ffff;
                
              
                margin-top: 50px;
                border-radius: 10px;
                margin-left: 1%;
            }
            .title {
                padding-top: 30px;
                font-size: 30px;
                font-weight: 700;
                text-align: center;
            }

            
        </style>
    </body>         
</html>
